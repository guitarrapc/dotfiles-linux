name: Update aqua
on:
  workflow_dispatch:
  schedule:
    # biweekly Sunday at midnight UTC
    - cron: "0 0 */14 * SUN"

jobs:
  aqua:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ secrets.SYNCED_ACTIONS_BOT_APPID }}
          private-key: ${{ secrets.SYNCED_ACTIONS_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: aquaproj/aqua-installer@82d0e83878a8657c4a6f2ff1755d3bfbfc67f329 # v4.1.0
        with:
          aqua_version: v2.55.1
      - name: aqua update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: aqua update
        working-directory: ${{ github.workspace }}/HOME/.config/aquaproj-aqua
      # is change happen?
      - name: Check for modified files
        id: git-check
        run: echo "modified=$(if git diff-index --quiet HEAD --; then echo "false"; else echo "true"; fi)" >> "$GITHUB_OUTPUT"
      # Commit if change happen, then create PR. force push when ions[botbranch/pr already exists.
      - name: Configure git for GitHub Acitons
        if: ${{ steps.git-check.outputs.modified == 'true' }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
      - name: Commit changes
        if: ${{ steps.git-check.outputs.modified == 'true' }}
        run: |
          git switch -c "auto-pr/update-aqua"
          git add HOME/.config/aquaproj-aqua/aqua.yaml
          git commit -m "[aqua update] Automated changes"
          git push --force origin "auto-pr/update-aqua"
      - name: Create pull request with gh
        if: ${{ steps.git-check.outputs.modified == 'true' }}
        run: |
          # check if PR already exists
          if [[ "$(gh pr list --head "auto-pr/update-aqua" --json number --jq ".[0].number")" != "" ]]; then
            echo "Pull request already exists. Exiting."
            exit 0
          fi

          cat <<EOF > body.md
          ## summary
          Updated aqua packages.
          EOF
          gh pr create --base master --head auto-pr/update-aqua --title "[automate] Update aqua packages" --body-file "body.md" --label "automated pr"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
